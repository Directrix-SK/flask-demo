<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ startup_name }} - Public Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="fw-bold">🚀 {{ startup_name }}</h2>
                <span class="badge bg-success">Verified Govt Portal Entity</span>
            </div>
        </div>

        <h4>Verified Milestones</h4>
        <div class="list-group">
            {% for item in milestones %}
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1">{{ item.title }}</h5>
                        <small class="text-muted">Status: {{ item.status }}</small>
                    </div>
                    {% if item.certificate_signature %}
                        <span class="badge bg-primary rounded-pill">Cryptographically Signed</span>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
