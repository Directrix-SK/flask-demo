<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - All Users</title>
    <style>
        table { width: 80%; border-collapse: collapse; margin: 20px auto; font-family: sans-serif; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #004085; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; background-color: #e2e3e5; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">User Directory (Admin View)</h2>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Password</th>
                <th>Role</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td><strong>{{ user.username }}</strong></td>
                <td><code>{{ user.password }}</code></td>
                <td><span class="badge">{{ user.role }}</span></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p style="text-align: center;"><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
</body>
</html>
